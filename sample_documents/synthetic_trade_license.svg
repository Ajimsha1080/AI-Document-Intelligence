<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <!-- Document Border -->
  <rect width="800" height="1100" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#d4af37" stroke-width="2"/>

  <!-- Header -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#00732f" text-anchor="middle">GOVERNMENT OF DUBAI / حكومة دبي</text>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle">Department of Economy and Tourism / دائرة الاقتصاد والسياحة</text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#b91c1c" text-anchor="middle">COMMERCIAL LICENSE / رخصة تجارية</text>

  <!-- Divider Line -->
  <line x1="50" y1="165" x2="750" y2="165" stroke="#9ca3af" stroke-width="2"/>

  <!-- License Details Grid -->
  <g transform="translate(60, 200)">
    <!-- License Number -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">License No / رقم الرخصة:</text>
    <text x="320" y="30" font-family="monospace" font-size="20" font-weight="bold" fill="#111827">CN-1029384</text>

    <!-- Company Name EN -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Company Name (EN):</text>
    <text x="320" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">GULF HORIZON LOGISTICS L.L.C.</text>

    <!-- Company Name AR -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Trade Name (AR) / الاسم التجاري:</text>
    <text x="320" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">شركة أفق الخليج للخدمات اللوجستية ذ.م.م</text>

    <!-- Legal Type -->
    <text x="0" y="180" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Legal Status / الشكل القانوني:</text>
    <text x="320" y="180" font-family="Arial, sans-serif" font-size="16" fill="#111827">Limited Liability Company (LLC)</text>

    <!-- Issue Date -->
    <text x="0" y="230" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Issue Date / تاريخ الإصدار:</text>
    <text x="320" y="230" font-family="Arial, sans-serif" font-size="16" fill="#111827">01/12/2021</text>

    <!-- Expiry Date -->
    <text x="0" y="280" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Expiry Date / تاريخ الانتهاء:</text>
    <text x="320" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#047857">30/11/2027</text>

    <!-- Operating Authority -->
    <text x="0" y="330" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Issuing Authority / سلطة الترخيص:</text>
    <text x="320" y="330" font-family="Arial, sans-serif" font-size="16" fill="#111827">Dubai Department of Economy and Tourism (DET)</text>
  </g>

  <!-- Official Stamp / Seal (Synthetic) -->
  <circle cx="580" cy="750" r="75" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="580" cy="750" r="65" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="745" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">GOVT OF DUBAI - DET</text>
  <text x="580" y="765" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">دائرة الاقتصاد والسياحة</text>

  <!-- QR Code box (synthetic) -->
  <rect x="100" y="680" width="130" height="130" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="165" y="750" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">[QR CODE]</text>

  <!-- Footer Disclaimer -->
  <text x="400" y="1040" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">SYNTHETIC TEST DOCUMENT FOR UAE REGULATORY COMPLIANCE MVP - CONTAINS NO REAL PII</text>
</svg>
