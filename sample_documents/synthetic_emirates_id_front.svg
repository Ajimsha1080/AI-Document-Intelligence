<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e9e4d4"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="856" height="540" rx="24" fill="url(#cardGrad)" stroke="#bfa15f" stroke-width="3"/>

  <!-- UAE ICP Header Banner -->
  <rect x="0" y="0" width="856" height="80" rx="24" fill="#00732f"/>
  <rect x="0" y="70" width="856" height="10" fill="#ff0000"/>
  <rect x="0" y="80" width="856" height="8" fill="#000000"/>

  <text x="30" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">UNITED ARAB EMIRATES</text>
  <text x="30" y="65" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Federal Authority for Identity, Citizenship, Customs and Port Security</text>

  <text x="826" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="end">دولة الإمارات العربية المتحدة</text>
  <text x="826" y="65" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="end">الهيئة الاتحادية للهوية والجنسية والجمارك وأمن المنافذ</text>

  <!-- Photo Box -->
  <rect x="40" y="140" width="180" height="230" rx="8" fill="#d1d5db" stroke="#9ca3af" stroke-width="2"/>
  <text x="130" y="260" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">SYNTHETIC PHOTO</text>

  <!-- Microchip Symbol -->
  <rect x="250" y="140" width="60" height="48" rx="6" fill="#d4af37" stroke="#aa8c2c" stroke-width="2"/>

  <!-- Emirates ID Number -->
  <text x="250" y="230" font-family="monospace" font-size="26" font-weight="bold" fill="#111827">ID Number / رقم الهوية</text>
  <text x="250" y="270" font-family="monospace" font-size="36" font-weight="bold" fill="#b91c1c">784-1988-1234567-1</text>

  <!-- Arabic Name -->
  <text x="816" y="325" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="end">الاسم:</text>
  <text x="816" y="355" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="end">سالم راشد سيف الشامسي</text>

  <!-- English Name -->
  <text x="250" y="390" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Name:</text>
  <text x="250" y="415" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827">SALEM RASHED SAIF AL SHAMSI</text>

  <!-- Nationality & Dates -->
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Nationality / الجنسية: <tspan font-weight="bold" fill="#111827">United Arab Emirates / الإمارات</tspan></text>
  <text x="250" y="490" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Date of Birth / تاريخ الميلاد: <tspan font-weight="bold" fill="#111827">15/04/1988</tspan></text>
  <text x="560" y="490" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Expiry / الانتهاء: <tspan font-weight="bold" fill="#111827">14/04/2028</tspan></text>

  <!-- Watermark disclaimer -->
  <text x="428" y="525" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">SYNTHETIC TEST SAMPLE FOR UAE DOCUMENT INTELLIGENCE MVP - NO REAL DATA</text>
</svg>
